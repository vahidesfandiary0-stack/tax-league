name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch legacy Cafe Bazaar Gradle plugin
        run: |
          set -euo pipefail
          python - <<'INNER'
          from pathlib import Path
          import os
          import re

          cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          matches = sorted(cache.glob("hosted/pub.dev/flutter_poolakey-*/android/build.gradle"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one flutter_poolakey Gradle file, found {len(matches)}")

          path = matches[0]
          content = path.read_text(encoding="utf-8").replace("jcenter()", "mavenCentral()")
          pattern = re.compile(
              r"""(?m)^plugins\s*\{\s*id\s+["']com\.android\.library["']\s*id\s+["']kotlin-android["']\s*\}"""
          )
          content, count = pattern.subn(
              'apply plugin: "com.android.library"\napply plugin: "kotlin-android"',
              content,
              count=1,
          )
          if count == 0:
              if ('apply plugin: "com.android.library"' not in content or
                      'apply plugin: "kotlin-android"' not in content):
                  raise SystemExit("Unrecognized Poolakey Gradle plugin structure; refusing unsafe patch.")
          if "jcenter()" in content or "plugins {" in content:
              raise SystemExit("Poolakey Gradle patch verification failed.")
          path.write_text(content, encoding="utf-8")
          print(f"Patched and verified {path}")
          INNER
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name tax_league .
      - name: Configure JitPack for Cafe Bazaar SDK
        run: |
          set -euo pipefail
          python - <<'INNER'
          from pathlib import Path
          import re

          candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          path = next((candidate for candidate in candidates if candidate.is_file()), None)
          if path is None:
              raise SystemExit("Generated Android settings.gradle(.kts) was not found.")
          content = path.read_text(encoding="utf-8")
          if "https://jitpack.io" not in content:
              pattern = r"(dependencyResolutionManagement\\s*\\{.*?repositories\\s*\\{)"
              match = re.search(pattern, content, flags=re.S)
              if match is None:
                  raise SystemExit("Could not safely locate dependencyResolutionManagement.repositories.")
              repository = ('maven { url = uri("https://jitpack.io") }'
                            if path.suffix == ".kts"
                            else "maven { url 'https://jitpack.io' }")
              content = content[:match.end()] + "\\n        " + repository + content[match.end():]
              path.write_text(content, encoding="utf-8")
          if "https://jitpack.io" not in path.read_text(encoding="utf-8"):
              raise SystemExit("JitPack repository verification failed.")
          print(f"JitPack configured in {path}")
          INNER
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://example.invalid
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose syntax
        run: |
          set -euo pipefail
          cat > .env.production <<'EOF'
          DJANGO_SECRET_KEY=ci-only-not-for-production-12345678901234567890123456789012345678901234567890
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=api.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS=https://api.example.invalid
          DJANGO_CORS_ALLOWED_ORIGINS=https://app.example.invalid
          DJANGO_SECURE_SSL_REDIRECT=true
          DJANGO_SECURE_HSTS_SECONDS=31536000
          POSTGRES_DB=tax_league
          POSTGRES_USER=tax_league
          POSTGRES_PASSWORD=ci-only-url-safe-password
          DOMAIN=api.example.invalid
          CADDY_EMAIL=ci@example.invalid
          EOF
          docker compose --env-file .env.production -f infrastructure/compose.production.yml config --quiet
          docker run --rm --env-file .env.production -v "$PWD/infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          rm -f .env.production
      - name: Build backend production image
        run: docker build --tag tax-league-backend:ci ./backend
