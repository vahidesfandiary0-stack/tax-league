name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name tax_league .
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://example.invalid
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose syntax
        run: |
          set -euo pipefail
          cat > .env.production <<'EOF'
          DJANGO_SECRET_KEY=ci-only-not-for-production-12345678901234567890123456789012345678901234567890
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=api.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS=https://api.example.invalid
          DJANGO_CORS_ALLOWED_ORIGINS=https://app.example.invalid
          DJANGO_SECURE_SSL_REDIRECT=true
          DJANGO_SECURE_HSTS_SECONDS=31536000
          POSTGRES_DB=tax_league
          POSTGRES_USER=tax_league
          POSTGRES_PASSWORD=ci-only-url-safe-password
          DOMAIN=api.example.invalid
          CADDY_EMAIL=ci@example.invalid
          EOF
          docker compose --env-file .env.production -f infrastructure/compose.production.yml config --quiet
          docker run --rm --env-file .env.production -v "$PWD/infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          rm -f .env.production
      - name: Build backend production image
        run: docker build --tag tax-league-backend:ci ./backend
