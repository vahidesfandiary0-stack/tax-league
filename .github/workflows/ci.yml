name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "mobile/ui-redesign-20261119", "repair/profile-subscriptions-baseline-20261126"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Generate Android project files
        run: flutter create --platforms=android --org ir.raqtiva --project-name tax_league .
      - name: Set Android compile SDK 36 for plugins
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"),
                        Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          content = gradle.read_text()
          updated, count = re.subn(
              r'compileSdk\s*(?:=|Version)\s*flutter\.compileSdkVersion',
              'compileSdk = 36' if gradle.suffix == ".kts" else 'compileSdkVersion 36',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not safely set Android compile SDK to 36")
          gradle.write_text(updated)
          print(f"Configured {gradle} to compile against Android API 36")
          PY
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root" -type f -name sdkmanager -print -quit)"
          if [ -z "$sdkmanager_path" ]; then
            echo "Android SDK manager executable not found under $sdk_root" >&2
            find "$sdk_root/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          yes | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" "platforms;android-36"
      - name: Verify Android application identity
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          expected = "ir.raqtiva.tax_league"
          gradle_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in gradle_files if p.is_file()), None)
          if gradle is None:
              raise SystemExit("FAIL: Android app Gradle file not found")

          content = gradle.read_text()
          for field in ("namespace", "applicationId"):
              pattern = rf'^\s*{field}\s*=\s*["\']{re.escape(expected)}["\']\s*$'
              if not re.search(pattern, content, re.MULTILINE):
                  raise SystemExit(f"FAIL: {field} is not {expected}")

          activities = list(Path("android/app/src/main").rglob("MainActivity.kt"))
          if not activities:
              raise SystemExit("FAIL: MainActivity.kt not found")
          if not any(
              re.search(rf'^\s*package\s+{re.escape(expected)}\s*$', a.read_text(), re.MULTILINE)
              for a in activities
          ):
              raise SystemExit("FAIL: MainActivity package does not match")

          print(f"PASS: Android identity = {expected}")
          PY
      - name: Generate official Android launcher icon
        working-directory: mobile
        run: |
          set -euo pipefail
          test -s assets/brand/logo_full.png
          dart run flutter_launcher_icons
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo "Official launcher icon generated from assets/brand/logo_full.png"
      - name: Set Persian Android launcher name
        run: |
          set -euo pipefail
          python - <<'INNER'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.is_file():
              raise SystemExit("Generated AndroidManifest.xml was not found.")
          tree = ET.parse(path)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("Android manifest has no application element.")
          android_ns = "{http://schemas.android.com/apk/res/android}"
          application.set(android_ns + "label", "لیگ نخبگان مالیاتی")
          embedding = next(
              (item for item in application.findall("meta-data")
               if item.get(android_ns + "name") == "flutterEmbedding"),
              None,
          )
          if embedding is None:
              embedding = ET.SubElement(application, "meta-data")
              embedding.set(android_ns + "name", "flutterEmbedding")
          embedding.set(android_ns + "value", "2")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          verified = ET.parse(path).getroot().find("application")
          label = verified.get(android_ns + "label") if verified is not None else None
          metadata = next(
              (item for item in verified.findall("meta-data")
               if item.get(android_ns + "name") == "flutterEmbedding"),
              None,
          ) if verified is not None else None
          raw_manifest = path.read_text(encoding="utf-8")
          if (label != "لیگ نخبگان مالیاتی" or metadata is None
                  or metadata.get(android_ns + "value") != "2"
                  or "android:name=" not in raw_manifest
                  or "android:value=" not in raw_manifest):
              raise SystemExit("Android launcher label / v2 embedding XML verification failed.")
          print("Android launcher name and v2 embedding metadata verified in Android-prefixed XML")
          INNER
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://raqtiva.ir
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose syntax
        run: |
          set -euo pipefail
          cat > .env.production <<'EOF'
          DJANGO_SECRET_KEY=ci-only-not-for-production-12345678901234567890123456789012345678901234567890
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=api.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS=https://api.example.invalid
          DJANGO_CORS_ALLOWED_ORIGINS=https://app.example.invalid
          DJANGO_SECURE_SSL_REDIRECT=true
          DJANGO_SECURE_HSTS_SECONDS=31536000
          POSTGRES_DB=tax_league
          POSTGRES_USER=tax_league
          POSTGRES_PASSWORD=ci-only-url-safe-password
          DOMAIN=api.example.invalid
          CADDY_EMAIL=ci@example.invalid
          EOF
          docker compose --env-file .env.production -f infrastructure/compose.production.yml config --quiet
          docker run --rm --env-file .env.production -v "$PWD/infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          rm -f .env.production
      - name: Build backend production image
        run: docker build --tag tax-league-backend:ci ./backend
