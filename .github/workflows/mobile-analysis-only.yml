name: Mobile analysis only - Flutter 3.47.2

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/free-night-board-top5-paid-analytics-20261127"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-analysis-only.yml"

permissions:
  contents: read

jobs:
  mobile-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart and Flutter
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
