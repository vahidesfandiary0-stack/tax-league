name: Android signed release

on:
  push:
    branches:
      - "release/googleplay-slider-*"
  pull_request:
    branches:
      - "release/googleplay-slider-*"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production API base URL (HTTPS)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'https://raqtiva.ir' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "api_base_url must start with https://" >&2; exit 1 ;;
          esac
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify Flutter lock file and exclude CafeBazaar SDK
        working-directory: mobile
        run: |
          set -euo pipefail
          test -s pubspec.lock
          if grep -q '^  flutter_poolakey:' pubspec.lock; then
            echo "CafeBazaar Poolakey must not be present in the resolved dependency graph." >&2
            exit 1
          fi
          if grep -R -nE 'flutter_poolakey|FlutterPoolakey|payments/bazaar/' lib --exclude='bazaar_poolakey_stub.dart'; then
            echo "CafeBazaar-specific mobile integration must not ship in the Google Play build." >&2
            exit 1
          fi

      - name: Upload resolved Flutter lock file
        uses: actions/upload-artifact@v4
        with:
          name: raqtiva-flutter-lock
          path: mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Check Dart formatting
        working-directory: mobile
        run: dart format lib test

      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --no-pub

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --org ir.raqtiva --project-name tax_league .
      - name: Pin Android Kotlin migration flags for plugin compatibility
        working-directory: mobile
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("android/gradle.properties")
          if not path.is_file():
              raise SystemExit("Generated Android gradle.properties was not found")
          lines = path.read_text(encoding="utf-8").splitlines()
          required = {
              "android.builtInKotlin": "false",
              "android.newDsl": "false",
          }
          for key, value in required.items():
              prefix = key + "="
              lines = [line for line in lines if not line.startswith(prefix)]
              lines.append(prefix + value)
          path.write_text("\\n".join(lines) + "\\n", encoding="utf-8")
          actual = path.read_text(encoding="utf-8")
          for key, value in required.items():
              if f"{key}={value}" not in actual:
                  raise SystemExit(f"Could not enforce {key}={value}")
          print("PASS: AGP 9 compatibility flags pinned for the selected Flutter plugins.")
          PY

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Set Android API 36 and secure manifest defaults
        working-directory: mobile
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36", 1)
          source = source.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36", 1)
          if "targetSdk = 36" not in source:
              source, count = re.subn(r"(defaultConfig\s*\{)", r"\1\n        targetSdk = 36", source, count=1)
              if count != 1:
                  raise SystemExit("Could not safely set targetSdk to 36")
          if "compileSdk = 36" not in source or "targetSdk = 36" not in source:
              raise SystemExit("Android API 36 configuration verification failed")
          gradle.write_text(source, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")
          if not re.search(r'<uses-permission\b[^>]*android:name=["\']android.permission.INTERNET["\']', xml):
              xml, count = re.subn(r"(?m)^\s*<application\b",
                  '    <uses-permission android:name="android.permission.INTERNET" />\n\n    <application',
                  xml, count=1)
              if count != 1:
                  raise SystemExit("Could not add required INTERNET permission")
          match = re.search(r"<application\b[^>]*>", xml, re.S)
          if not match:
              raise SystemExit("Android application element not found")
          tag = match.group(0)
          for name, value in (("android:allowBackup", "false"), ("android:usesCleartextTraffic", "false")):
              pattern = re.escape(name) + r'="[^"]*"'
              if re.search(pattern, tag):
                  tag = re.sub(pattern, name + '="' + value + '"', tag, count=1)
              else:
                  tag = tag[:-1] + " " + name + '="' + value + '">'
          xml = xml[:match.start()] + tag + xml[match.end():]
          if 'android:allowBackup="false"' not in xml or 'android:usesCleartextTraffic="false"' not in xml:
              raise SystemExit("Secure Android manifest defaults not verified")
          manifest.write_text(xml, encoding="utf-8")
          print("PASS: API 36, backup disabled, cleartext disabled, and INTERNET permission only added.")
          PY

      - name: Verify permanent Android application identity
        working-directory: mobile
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts
          grep -F 'namespace = "ir.raqtiva.tax_league"' "$GRADLE"
          grep -F 'applicationId = "ir.raqtiva.tax_league"' "$GRADLE"

      - name: Generate official Android app icon and name
        working-directory: mobile
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          python - <<'INNER'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          old = 'android:label="tax_league"'
          new = 'android:label="لیگ نخبگان مالیاتی"'
          if new not in content:
              if old not in content:
                  raise SystemExit("Android application label was not found; refusing to guess.")
              content = content.replace(old, new, 1)
              manifest.write_text(content, encoding="utf-8")
          print("Official Persian app name configured.")
          INNER

      - name: Configure signing
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ACTUAL_SHA256=$(sha256sum android/app/upload-keystore.jks | cut -d ' ' -f 1)
          EXPECTED_SHA256=87fa733f659a864667a03e8eb040d2423b7751ba7a822c0e8b74048672ec7fb0
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then echo "ERROR: GitHub Secret decoded to a different keystore file" >&2; echo "Received SHA256: $ACTUAL_SHA256"; echo "Received bytes: $(wc -c < android/app/upload-keystore.jks)"; exit 1; fi
          echo "PASS: Decoded keystore matches the verified original file."
          keytool -list -storetype JKS -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "PASS: JKS format, store password, and alias verified."
          keytool -certreq -storetype JKS -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/tax-league-check.csr" >/dev/null
          rm -f "$RUNNER_TEMP/tax-league-check.csr"
          echo "PASS: Private key password verified."
          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "storeFile": "upload-keystore.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
          python scripts/configure_android_signing.py

      - name: Build signed release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'https://raqtiva.ir' }}
        run: |
          set -euo pipefail
          build_with_retry() {
            local target="$1"
            local attempt=1
            while true; do
              if flutter build "$target" --release --dart-define=API_BASE_URL="$API_BASE_URL"; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "Flutter $target release build failed after 3 attempts." >&2
                return 1
              fi
              local delay=$((attempt * 30))
              echo "Flutter $target build failed (likely transient dependency fetch); retrying in ${delay}s (attempt $((attempt + 1))/3)." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }
          build_with_retry apk
          build_with_retry appbundle

      - name: Verify release internet permission
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p build/reports
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee build/reports/android-permissions.txt
          python - <<'PY'
          from pathlib import Path
          import re
          report = Path("build/reports/android-permissions.txt").read_text()
          permissions = set(re.findall(r"uses-permission(?:-sdk-\d+)?[^\n]*name='([^']+)'", report))
          # Exact permission set observed in the owner-approved Play Protect baseline APK.
          allowed = {"android.permission.INTERNET", "ir.raqtiva.tax_league.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"}
          sensitive = {
              "android.permission.READ_SMS", "android.permission.RECEIVE_SMS", "android.permission.SEND_SMS",
              "android.permission.READ_CONTACTS", "android.permission.WRITE_CONTACTS",
              "android.permission.READ_PHONE_STATE", "android.permission.CALL_PHONE",
              "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION", "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO", "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE", "android.permission.MANAGE_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_AUDIO", "android.permission.REQUEST_INSTALL_PACKAGES",
              "android.permission.QUERY_ALL_PACKAGES", "android.permission.SYSTEM_ALERT_WINDOW",
          }
          if permissions & sensitive:
              raise SystemExit("Unexpected sensitive permissions: " + ", ".join(sorted(permissions & sensitive)))
          if permissions - allowed:
              raise SystemExit("Review unapproved permissions: " + ", ".join(sorted(permissions - allowed)))
          if "android.permission.INTERNET" not in permissions:
              raise SystemExit("INTERNET permission missing")
          print("PASS: Android permission allowlist.")
          PY

      - name: Verify APK signature and approved signing certificate
        working-directory: mobile
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          EXPECTED_CERT_SHA256=d0748f8bfda87ae5582de9b560637f88348fb9b39d43e7759227983cbebd24b8
          test -s "$APK"
          test -s "$AAB"
          SIGNER_REPORT="$RUNNER_TEMP/raqtiva-apk-signer.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$SIGNER_REPORT"
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$SIGNER_REPORT"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "PASS: APK signer matches the owner-approved certificate; APK and AAB signatures verified."

      - name: Inspect APK permissions and Android compatibility
        working-directory: mobile
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          REPORT=build/reports/android-diagnostics.txt
          mkdir -p build/reports
          {
            echo "=== APK signing certificate ==="
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo
            echo "=== APK permissions ==="
            "$AAPT" dump permissions "$APK"
            echo
            echo "=== APK SHA-256 ==="
            sha256sum "$APK"
            echo
            echo "=== AAB SHA-256 ==="
            sha256sum build/app/outputs/bundle/release/app-release.aab
            echo
            echo "=== APK package and Android SDK information ==="
            "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
            APP_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
            VERSION_NAME="${APP_VERSION%%+*}"
            VERSION_CODE="${APP_VERSION##*+}"
            test -n "$VERSION_NAME"
            test -n "$VERSION_CODE"
            if [ "$VERSION_CODE" -le 4 ]; then
              echo "Release versionCode must be greater than the owner-approved baseline versionCode 4." >&2
              exit 1
            fi
            "$AAPT" dump badging "$APK" | grep -F "package: name='ir.raqtiva.tax_league' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
            "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'36'"
            echo
            echo "=== Resolved Flutter dependencies ==="
            flutter pub deps --style=compact
          } > "$REPORT"
          echo "Diagnostic report generated: $REPORT"
          cat "$REPORT"

      - name: Upload Android diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-android-diagnostics
          path: mobile/build/reports/android-diagnostics.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-google-play-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
