name: Android signed release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production API base URL (HTTPS)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "api_base_url must start with https://" >&2; exit 1 ;;
          esac
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --project-name tax_league .

      - name: Configure signing
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "storeFile": "upload-keystore.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
          python scripts/configure_android_signing.py

      - name: Build signed release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify APK signature
        working-directory: mobile
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
