name: Android signed release

on:
  push:
    branches:
      - mobile/formal-damask-skin-20261122
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production API base URL (HTTPS)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "api_base_url must start with https://" >&2; exit 1 ;;
          esac
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify Flutter lock file
        working-directory: mobile
        run: test -s pubspec.lock

      - name: Upload resolved Flutter lock file
        uses: actions/upload-artifact@v4
        with:
          name: raqtiva-flutter-lock
          path: mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Patch legacy Cafe Bazaar Gradle plugin
        working-directory: mobile
        run: |
          set -euo pipefail
          python - <<'INNER'
          from pathlib import Path
          import os
          import re

          cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          matches = sorted(cache.glob("hosted/pub.dev/flutter_poolakey-*/android/build.gradle"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one flutter_poolakey Gradle file, found {len(matches)}")

          path = matches[0]
          content = path.read_text(encoding="utf-8")

          content = content.replace("jcenter()", "mavenCentral()")

          plugins_pattern = r"""(?m)^\s*plugins\s*\{\s*id\s*["']com\.android\.library["']\s*id\s*["']kotlin-android["']\s*\}"""
          has_apply_plugins = (
              'apply plugin: "com.android.library"' in content
              and 'apply plugin: "kotlin-android"' in content
          )

          if has_apply_plugins:
              print("Poolakey already uses compatible apply plugin syntax")
          else:
              updated, count = re.subn(
                  plugins_pattern,
                  'apply plugin: "com.android.library"\napply plugin: "kotlin-android"',
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      "Unrecognized Poolakey Gradle plugin structure; refusing unsafe patch.\n"
                      + content
                  )
              content = updated
          path.write_text(content, encoding="utf-8")
          print(f"Patched {path}")
          INNER

      - name: Check Dart formatting
        working-directory: mobile
        run: dart format lib test

      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --no-pub

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --org ir.raqtiva --project-name tax_league .
      - name: Ensure Android internet permission
        working-directory: mobile
        run: |
          set -euo pipefail
          python - <<'INNER'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permission = "android.permission.INTERNET"
          pattern = r'<uses-permission\b[^>]*android:name=["\']' + permission + r'["\']'
          if not re.search(pattern, s):
              s, n = re.subn(r'(?m)^\s*<application\b',
                  '    <uses-permission android:name="' + permission + '" />\n\n    <application',
                  s, count=1)
              if n != 1:
                  raise SystemExit("Manifest application tag not found")
              p.write_text(s, encoding="utf-8")
          print("INTERNET permission configured.")
          INNER

      - name: Configure JitPack for Cafe Bazaar SDK
        working-directory: mobile
        run: |
          set -euo pipefail
          python - <<'INNER'
          from pathlib import Path
          import re

          candidates = [Path("android/build.gradle.kts"), Path("android/build.gradle")]
          path = next((candidate for candidate in candidates if candidate.is_file()), None)
          if path is None:
              raise SystemExit("Generated Android root build.gradle(.kts) was not found.")
          content = path.read_text(encoding="utf-8")
          if "https://jitpack.io" not in content:
              pattern = r"(allprojects\s*\{\s*repositories\s*\{)"
              match = re.search(pattern, content, flags=re.S)
              if match is None:
                  raise SystemExit("Could not safely locate allprojects.repositories in Android root build file.")
              repository = ('maven { url = uri("https://jitpack.io") }'
                            if path.suffix == ".kts"
                            else "maven { url 'https://jitpack.io' }")
              content = content[:match.end()] + "\n        " + repository + content[match.end():]
              path.write_text(content, encoding="utf-8")
          if "https://jitpack.io" not in path.read_text(encoding="utf-8"):
              raise SystemExit("JitPack repository verification failed.")
          print(f"JitPack configured in {path}")
          INNER
      - name: Verify permanent Android application identity
        working-directory: mobile
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts
          grep -F 'namespace = "ir.raqtiva.tax_league"' "$GRADLE"
          grep -F 'applicationId = "ir.raqtiva.tax_league"' "$GRADLE"

      - name: Generate official Android app icon and name
        working-directory: mobile
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          python - <<'INNER'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          old = 'android:label="tax_league"'
          new = 'android:label="لیگ نخبگان مالیاتی"'
          if new not in content:
              if old not in content:
                  raise SystemExit("Android application label was not found; refusing to guess.")
              content = content.replace(old, new, 1)
              manifest.write_text(content, encoding="utf-8")
          print("Official Persian app name configured.")
          INNER

      - name: Configure signing
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ACTUAL_SHA256=$(sha256sum android/app/upload-keystore.jks | cut -d ' ' -f 1)
          EXPECTED_SHA256=87fa733f659a864667a03e8eb040d2423b7751ba7a822c0e8b74048672ec7fb0
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then echo "ERROR: GitHub Secret decoded to a different keystore file" >&2; echo "Received SHA256: $ACTUAL_SHA256"; echo "Received bytes: $(wc -c < android/app/upload-keystore.jks)"; exit 1; fi
          echo "PASS: Decoded keystore matches the verified original file."
          keytool -list -storetype JKS -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "PASS: JKS format, store password, and alias verified."
          keytool -certreq -storetype JKS -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/tax-league-check.csr" >/dev/null
          rm -f "$RUNNER_TEMP/tax-league-check.csr"
          echo "PASS: Private key password verified."
          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "storeFile": "upload-keystore.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
          python scripts/configure_android_signing.py

      - name: Build signed release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify release internet permission
        working-directory: mobile
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | grep -F "android.permission.INTERNET"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | grep -F "com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR"

      - name: Verify APK signature
        working-directory: mobile
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"

      - name: Inspect APK permissions and Android compatibility
        working-directory: mobile
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          REPORT=build/reports/android-diagnostics.txt
          mkdir -p build/reports
          {
            echo "=== APK signing certificate ==="
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo
            echo "=== APK permissions ==="
            "$AAPT" dump permissions "$APK"
            echo
            echo "=== APK package and Android SDK information ==="
            "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
            echo
            echo "=== Resolved Flutter dependencies ==="
            flutter pub deps --style=compact
          } > "$REPORT"
          echo "Diagnostic report generated: $REPORT"
          cat "$REPORT"

      - name: Upload Android diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-android-diagnostics
          path: mobile/build/reports/android-diagnostics.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
