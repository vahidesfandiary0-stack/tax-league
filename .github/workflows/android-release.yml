name: Android signed release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production API base URL (HTTPS)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "api_base_url must start with https://" >&2; exit 1 ;;
          esac
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"


      - name: Verify production API health before release build
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error --max-time 20 "${API_BASE_URL%/}/api/v1/health/")
          printf '%s' "$RESPONSE" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status") == "ok", f"Unexpected API health response: {data}"'
          echo "Production API health check passed."

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --org ir.raqtiva --project-name tax_league .
      - name: Verify permanent Android application identity
        working-directory: mobile
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts
          grep -F 'namespace = "ir.raqtiva.tax_league"' "$GRADLE"
          grep -F 'applicationId = "ir.raqtiva.tax_league"' "$GRADLE"

      - name: Generate official Android app icon and name
        working-directory: mobile
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          python - <<'INNER'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          old = 'android:label="tax_league"'
          new = 'android:label="لیگ نخبگان مالیاتی"'
          if new not in content:
              if old not in content:
                  raise SystemExit("Android application label was not found; refusing to guess.")
              content = content.replace(old, new, 1)
              manifest.write_text(content, encoding="utf-8")
          print("Official Persian app name configured.")
          INNER

      - name: Configure signing
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ACTUAL_SHA256=$(sha256sum android/app/upload-keystore.jks | cut -d ' ' -f 1)
          EXPECTED_SHA256=87fa733f659a864667a03e8eb040d2423b7751ba7a822c0e8b74048672ec7fb0
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then echo "ERROR: GitHub Secret decoded to a different keystore file" >&2; echo "Received SHA256: $ACTUAL_SHA256"; echo "Received bytes: $(wc -c < android/app/upload-keystore.jks)"; exit 1; fi
          echo "PASS: Decoded keystore matches the verified original file."
          keytool -list -storetype JKS -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "PASS: JKS format, store password, and alias verified."
          keytool -certreq -storetype JKS -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/tax-league-check.csr" >/dev/null
          rm -f "$RUNNER_TEMP/tax-league-check.csr"
          echo "PASS: Private key password verified."
          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "storeFile": "upload-keystore.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
          python scripts/configure_android_signing.py

      - name: Build signed release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build signed Android App Bundle
        working-directory: mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify APK signature
        working-directory: mobile
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"

      - name: Inspect APK permissions and Android compatibility
        working-directory: mobile
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          REPORT=build/reports/android-diagnostics.txt
          mkdir -p build/reports
          {
            echo "=== APK signing certificate ==="
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo
            echo "=== APK permissions ==="
            "$AAPT" dump permissions "$APK"
            echo
            echo "=== APK package and Android SDK information ==="
            "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
            echo
            echo "=== Resolved Flutter dependencies ==="
            flutter pub deps --style=compact
          } > "$REPORT"
          echo "Diagnostic report generated: $REPORT"
          cat "$REPORT"


      - name: Verify App Bundle signature and generate release checksums
        working-directory: mobile
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$AAB"
          jarsigner -verify -strict -verbose "$AAB"
          mkdir -p build/reports
          sha256sum "$APK" "$AAB" > build/reports/release-sha256.txt
          cat build/reports/release-sha256.txt

      - name: Upload Android diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-android-diagnostics
          path: mobile/build/reports/android-diagnostics.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksums
        uses: actions/upload-artifact@v4
        with:
          name: tax-league-release-checksums
          path: mobile/build/reports/release-sha256.txt
          if-no-files-found: error
          retention-days: 14
