name: Keystore diagnostic

on:
  push:
    branches:
      - diagnostic/keystore-check

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Validate keystore without exposing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          FILE="$RUNNER_TEMP/diagnostic-keystore.p12"
          CSR="$RUNNER_TEMP/diagnostic.csr"
          trap 'rm -f "$FILE" "$CSR"' EXIT

          test -n "$KEYSTORE_BASE64" || { echo "FAIL: keystore secret is empty"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "FAIL: store password is empty"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "FAIL: key alias is empty"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "FAIL: key password is empty"; exit 1; }

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FILE" 2>/dev/null; then
            echo "FAIL: Base64 decoding failed"
            exit 1
          fi
          test -s "$FILE" || { echo "FAIL: decoded keystore is empty"; exit 1; }
          echo "PASS: Base64 decoded; file is non-empty"
          printf "Received file size: "
          stat -c %s "$FILE"
          printf "Received SHA256: "
          sha256sum "$FILE" | cut -d " " -f1

          if ! keytool -list -keystore "$FILE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "FAIL: keystore format or store password is invalid"
            exit 1
          fi
          echo "PASS: keystore opens with store password"

          if ! keytool -list -keystore "$FILE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "FAIL: configured alias is not present or cannot be read"
            exit 1
          fi
          echo "PASS: configured alias exists"

          if ! keytool -certreq -alias "$KEY_ALIAS" -keystore "$FILE" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -file "$CSR" >/dev/null 2>&1; then
            echo "FAIL: private key password is incorrect or key cannot be accessed"
            exit 1
          fi
          echo "PASS: private key is accessible with configured key password"
