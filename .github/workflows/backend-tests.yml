name: Backend tests

on:
  push:
    branches: ["main", "feature/personal-demo-exam-20261127", "feature/public-demo-exam-flow-tests-20261127"]
  pull_request:
    branches: ["main", "feature/free-night-board-top5-paid-analytics-20261127"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Django configuration
        run: python backend/manage.py check
      - name: Check migration consistency
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: python -m pytest -q
