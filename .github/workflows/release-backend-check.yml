name: Release backend verification

on:
  push:
    branches:
      - "work/raqtiva-playprotect-approved-20261126"
  pull_request:
    branches:
      - "work/raqtiva-playprotect-approved-20261126"
      - "release/googleplay-slider-20261125"
      - "release/googleplay-slider-final2-20261125"
    paths:
      - "backend/**"
      - "mobile/**"
      - ".github/workflows/release-backend-check.yml"

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: pytest
      - name: Run manual payment workflow tests explicitly
        run: pytest apps/payments/test_manual_payments.py -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Upload resolved Flutter lock file
        uses: actions/upload-artifact@v4
        with:
          name: raqtiva-ci-pubspec-lock
          path: mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 14
      - name: Verify resolved dependency versions
        run: |
          grep -A 3 '^  file_picker:' pubspec.lock
          grep -A 3 '^  flutter_secure_storage:' pubspec.lock
          grep -A 3 '^  win32:' pubspec.lock

