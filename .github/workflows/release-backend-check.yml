name: Release backend verification

on:
  push:
    branches:
      - "work/raqtiva-playprotect-approved-20261126"
  pull_request:
    branches:
      - "work/raqtiva-playprotect-approved-20261126"
      - "release/googleplay-slider-20261125"
      - "release/googleplay-slider-final2-20261125"
    paths:
      - "backend/**"
      - "mobile/**"
      - ".github/workflows/release-backend-check.yml"

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: pytest
      - name: Run manual payment workflow tests explicitly
        run: pytest apps/payments/test_manual_payments.py -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Commit generated lockfile and Dart formatting
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u lib test
          git add pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(mobile): lock dependencies and format Dart"
            git push
          fi

