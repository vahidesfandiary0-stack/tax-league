name: Mobile validation (Flutter 3.47.2)

on:
  push:
    branches:
      - "raqtiva/mobile-validation-3472-20261127"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-validation-3472.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raqtiva-mobile-validation-3472
  cancel-in-progress: true

jobs:
  mobile-validation:
    name: Format, analyze, and test (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Verify locked dependencies
        working-directory: mobile
        run: |
          set -euo pipefail
          test -s pubspec.lock
          flutter pub get --enforce-lockfile

      - name: Check Dart formatting without modifying files
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --no-pub
