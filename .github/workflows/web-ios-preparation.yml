name: Web and iOS preparation

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production API base URL, e.g. https://raqtiva.ir"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-web-and-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate API URL
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "api_base_url must start with https://" >&2; exit 1 ;;
          esac

      - name: Generate missing Flutter web and iOS platform scaffolding
        working-directory: mobile
        run: flutter create --platforms=web,ios --org ir.raqtiva --project-name tax_league .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter application
        working-directory: mobile
        run: flutter analyze

      - name: Build production web application
        working-directory: mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          flutter build web --release --pwa-strategy=offline-first --dart-define=API_BASE_URL="$API_BASE_URL"
          test -s build/web/index.html
          test -s build/web/manifest.json
          test -s build/web/flutter_service_worker.js

      - name: Upload web application artifact
        uses: actions/upload-artifact@v4
        with:
          name: raqtiva-web-pwa
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: 30

      - name: Build iOS simulator application (no Apple signing required)
        working-directory: mobile
        run: |
          set -euo pipefail
          flutter build ios --simulator --no-codesign
          test -d build/ios/iphonesimulator/Runner.app

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: raqtiva-ios-simulator
          path: mobile/build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 30
