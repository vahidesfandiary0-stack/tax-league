name: tax_league
description: Persian mobile client for Tax Champions League
publish_to: "none"
version: 0.1.3+4
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_full.png
    - assets/brand/founder_vahid_esfandiary.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/logo_full.png
  adaptive_icon_background: "#101827"
  adaptive_icon_foreground: assets/brand/logo_full.png
